[project]
name = "food-insights"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "elasticsearch>=9.5.1",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "pillow>=13.0.0",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.33",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 100
exclude = ["reference"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
